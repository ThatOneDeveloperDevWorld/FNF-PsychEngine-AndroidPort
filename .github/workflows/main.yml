# This is a basic workflow to help you get started with Actions

name: Build Android Port

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events for main or experimental branches
  push:
    branches: [ main, experimental ]
  pull_request:
    branches: [ main, experimental ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  buildAndroid:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      - name: Install Haxelibs and Dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          haxelib install hmm > /dev/null --quiet
          haxelib run hmm install
          # Optional: add extension-androidtools if your mobile code requires it
          haxelib git extension-androidtools https://github.com/MaysLastPlay77/extension-androidtools.git
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Configure Lime Android
        run: |
          lime setup android -y

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      - name: Compile Android APK
        run: haxelib run lime build android -final --app-version="4.0.0-${{ github.run_id}}" -D officialBuild

      - name: Publish APK Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: androidBuild
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          
